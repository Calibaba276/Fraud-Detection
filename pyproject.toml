[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-fraud-detection"
version = "0.1.0"
description = "Local-first banking transaction fraud detection platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "joblib==1.4.2",
  "numpy==2.2.1",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "pydantic==2.10.4",
  "scikit-learn==1.6.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.3"]
mlflow = ["mlflow==2.19.0"]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["fraud_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
fraud-generate = "fraud_detection.cli:generate"
fraud-train = "fraud_detection.cli:train"
fraud-evaluate = "fraud_detection.cli:evaluate"
